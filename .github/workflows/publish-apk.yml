name: Publish Android APK

on:
  workflow_run:
    workflows: [Build Tauri Android]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run id to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" -R "${{ github.repository }}" -n harbor-android-apk -D out
          ls -la out
          mv out/*.apk out/Harbor-android-arm64.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -R "${{ github.repository }}" -y --cleanup-tag || true
          gh release create android-latest out/Harbor-android-arm64.apk \
            -R "${{ github.repository }}" --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Harbor Android (arm64)" --prerelease \
            --notes "Latest Android build for arm64 tablets/phones (Android 8+). Debug-signed."
