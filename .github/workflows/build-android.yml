name: Build Tauri Android

on:
  push:
    branches: [main, beta-branch]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Install Rust (Android arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK"
          ls "$NDK"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android-aarch64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android
        run: pnpm tauri android init --ci

      # One fixed key for every build, so a new APK installs over the old one.
      # Gradle signs debug builds with ~/.android/debug.keystore.
      - name: Install signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_SIGNING_KEYSTORE secret is not set; this APK gets a throwaway key and will not update an installed copy."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i fingerprint || true

      - name: Build Android APK (arm64)
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri android build --apk --target aarch64 --debug --ci 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          {
            echo '### Android build failed'
            echo '```'
            grep -n -E '^error|error\[|error:|FAILED|panicked|What went wrong|Caused by|not found|cannot find|undefined reference' build.log | head -n 120
            echo '----- tail -----'
            tail -n 120 build.log
            echo '```'
          } | cut -c1-400 | head -c 60000 > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android-apk
          path: out/*.apk
          if-no-files-found: error
